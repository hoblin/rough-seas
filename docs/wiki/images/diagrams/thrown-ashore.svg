<ellipse cx='220' cy='172' rx='22' ry='9' fill='#8a5a35' stroke='#2b2722'/>
<text x='200' y='242' font-size='15' text-anchor='middle' fill='#2b2722' >Tied to a post: its swing reaches</text>
<text x='200' y='262' font-size='15' text-anchor='middle' fill='#b0472f' >the surf. Likely thrown ashore.</text>
<circle cx='660' cy='270' r='70' fill='none' stroke='#2b2722' stroke-dasharray='5 4'/>
<ellipse cx='660' cy='270' rx='16' ry='9' fill='#8d8780' stroke='#2b2722'/><line x1='638' y1='263' x2='682' y2='263' stroke='#6b4a2e' stroke-width='4'/>
<line x1='660' y1='266' x2='710' y2='218' stroke='#6b4a2e' stroke-width='2'/>
<ellipse cx='716' cy='212' rx='28' ry='11' fill='#8a5a35' stroke='#2b2722'/>
<line x1='660' y1='196' x2='660' y2='124' stroke='#2b2722' marker-start='url(#a)' marker-end='url(#a)'/>
<text x='670' y='167.0' font-size='15' text-anchor='start' fill='#2b2722' >open water to the shore</text>
<text x='660' y='370' font-size='15' text-anchor='middle' fill='#2b2722' >Anchored well out: the waves spend</text>
<text x='660' y='390' font-size='15' text-anchor='middle' fill='#2f6a9a' >themselves before they reach it.</text>
<text x='24' y='40' font-size='20' text-anchor='start' fill='#2b2722' font-weight='bold'>Left alone through a storm</text>
