<rect x='200' y='118' width='560' height='34' fill='white' opacity='0.35'/>
<text x='480' y='141' font-size='15' text-anchor='middle' fill='#7a6f62' >surf</text>
<circle cx='200' cy='158' r='46' fill='none' stroke='#2b2722' stroke-dasharray='5 4'/>
<rect x='196' y='104' width='8' height='12' fill='#6b4a2e'/>
