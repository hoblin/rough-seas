<text x='24' y='40' font-size='20' text-anchor='start' fill='#2b2722' font-weight='bold'>Where waves break</text>
<text x='24' y='66' font-size='16' text-anchor='start' fill='#7a6f62' >A wave breaks once the water is less than about 1.3 times its height deep,</text>
<text x='24' y='88' font-size='16' text-anchor='start' fill='#7a6f62' >so the bigger the sea, the further out the surf begins.</text>
