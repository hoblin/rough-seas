    <text transform="matrix(1 0 0 1 560 60)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="20" font-weight="bold" fill="#2b2722"><tspan x="0" y="0">A gale or a hurricane, seen from above</tspan></text>
    <text transform="matrix(1 0 0 1 560 86)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="16" fill="#7a6f62"><tspan x="0" y="0">Its wind circles the centre and spirals in:</tspan></text>
    <text transform="matrix(1 0 0 1 560 108)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="16" fill="#7a6f62"><tspan x="0" y="0">counter-clockwise north of the equator,</tspan></text>
    <text transform="matrix(1 0 0 1 560 130)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="16" fill="#7a6f62"><tspan x="0" y="0">clockwise south of it. Squalls just blow</tspan></text>
    <text transform="matrix(1 0 0 1 560 152)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="16" fill="#7a6f62"><tspan x="0" y="0">along their path.</tspan></text>
  </g>
</svg>
