<text x='588' y='236' font-size='14' text-anchor='start' fill='#2b2722' >wind</text>
<text x='656.0' y='279.0' font-size='14' text-anchor='start' fill='#b0472f' >the eye wall: the strongest wind</text>
<text x='586' y='488' font-size='13' text-anchor='start' fill='#7a6f62' >calm eye</text>
<text x='920' y='405.0' font-size='14' text-anchor='end' fill='#7a6f62' >weaker towards the edge</text>
<text x='560' y='60' font-size='20' text-anchor='start' fill='#2b2722' font-weight='bold'>A gale or a hurricane, seen from above</text>
<text x='560' y='86' font-size='16' text-anchor='start' fill='#7a6f62' >Its wind circles the centre and spirals in:</text>
<text x='560' y='106' font-size='16' text-anchor='start' fill='#7a6f62' >counter-clockwise north of the equator,</text>
<text x='560' y='126' font-size='16' text-anchor='start' fill='#7a6f62' >clockwise south of it. Squalls just blow</text>
<text x='560' y='146' font-size='16' text-anchor='start' fill='#7a6f62' >along their path.</text>
