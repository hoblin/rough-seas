    <text transform="matrix(1 0 0 1 632 262)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="14" fill="#b0472f"><tspan x="0" y="0">hurricane: strongest at the wall</tspan></text>
    <text transform="matrix(1 0 0 1 632 280)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="14" fill="#b0472f"><tspan x="0" y="0">of its small calm eye</tspan></text>
    <text transform="matrix(1 0 0 1 700 342)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="14" fill="#2f6a9a"><tspan x="0" y="0">gale: strongest in a broad band</tspan></text>
