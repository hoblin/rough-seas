name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: test "$GITHUB_REF_NAME" = "v$(jq -r .version RoughSeas/modinfo.json)"
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  draft:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" ./*.zip --draft --verify-tag --generate-notes

  publish:
    needs: draft
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
